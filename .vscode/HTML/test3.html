<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: rgb(245, 245, 245);
        }

        form {
            height: 500px;
            overflow: auto;
            width: 400px;
            border-radius: 20px;
            background-color: rgb(255, 255, 255);
            box-shadow: 8px 8px 8px #454b5a,
                inset -8px -8px 5px rgb(200, 200, 200),
                6px 6px 8px #454b5a;
            /* position: absolute;
            top: 50%;
            left:50%;
            translate: -50% -50%; */
            padding: 2em;
        }

        input:hover {
            background-color: #e1e2eb;
            border: solid 2px;
        }

        input:focus {
            outline: none;
            border: solid 2px #2f76e4;
        }

        input {
            height: 2em;
            border-radius: 10px;
            border-style: solid;

        }

        a:hover {
            color: rgb(138, 200, 242);
        }

        button {
            border-radius: 10px;
            border: solid 1px;
        }

        button:hover {
            transform: scale(1.1);
            background-color: rgb(138, 200, 242);
        }

        select:hover {
            background-color: #e1e2eb;
        }

        .must {
            color: red;
        }

        .agree:hover {
            background-color: #e1e2eb;
        }
    </style>
</head>

<body>
    <form>

        <br><br>
