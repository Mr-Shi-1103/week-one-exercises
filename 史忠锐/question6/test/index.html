<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辉夜姬的“月读”首播界面</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="live-container">
    <!-- 直播主画面区域 -->
    <div class="stream-box" data-status="● LIVE 01:23:45">
      <img src="images/kaguya-live.png" alt="辉夜姬直播立绘" class="streamer-img">
    </div>

    <!-- 弹幕互动区 -->
    <div class="chat-box">
      <div class="chat-message vip" data-badge="榜一">
        <img src="images/avatar-iroha.png" class="avatar">
        <span class="username">酒寄彩叶：</span>
        <span class="text">辉夜加油！这月的SC全投给你了！</span>
      </div>
      <div class="chat-message" data-badge="粉丝">
        <span class="username">月读路人甲：</span>
        <span class="text">新人主播？听说要挑战八千代大人？</span>
      </div>
    </div>
  </div>
</body>

</html>
