<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contain {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            grid-template-rows: repeat(3, 150px);
            gap: 16px;

        }

        #item {
            width: auto;
            height: auto;
        }

        .item-1 {
            background-color: red;
            border-radius: 30px;
            grid-column: 1/3;
        }

        .item-2 {
            background-color: green;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        .item-3 {
            background-color: blue;
            border-radius: 30px;
        }

        .item-4 {
            background-color: indigo;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            grid-column: 2/4;

        }

        .item-5 {
            background-color: yellow;
            border-radius: 100%;
            grid-column: 2/3;

        }
    </style>
</head>

<body>
    <div class="contain">
        <div id="item" class="item-1"></div>
        <div id="item" class="item-2"></div>
        <div id="item" class="item-3"></div>
        <div id="item" class="item-4"></div>
        <div id="item" class="item-5"></div>
    </div>
</body>

</html>
