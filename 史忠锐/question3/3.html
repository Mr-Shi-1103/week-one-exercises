<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: rgb(43, 43, 43);
    }

    .img-1 {
        z-index: -1;
        width: 500px;
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;

    }

    .img-2 {
        z-index: 0;
        width: 200px;
        position: absolute;
        top: 45%;
        left: 50%;
        translate: -50% -50%;

    }

    .img-3 {
        position: absolute;
        top: 100%;
        left: 0%;

    }

    .card {
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        background-color: rgba(0, 0, 0, 0.7);
        width: auto;
        height: auto;
        padding: 4%;
        border-radius: 10px;
        animation-name: card;
        animation-duration: 2s;


    }

    @keyframes card {
        0% {
            rotate: Y 90deg;
            background-color: rgba(0, 0, 0, 0);
        }

        100% {
            rotate: Y 0deg;
            background-color: rgba(0, 0, 0, 0.7)
        }

    }

    .q {
        text-align: center;
        line-height: 0px;
        color: rgba(255, 255, 255, 0.5);
    }

    .a {
        color: white;
        font-size: 2em;
        line-height: 5px;
        position: absolute;
        top: 30px;
        left: 20px;
    }

    .z {
        color: yellow;
        width: 1em;
        position: absolute;
        left: 25px;
        top: 120px;
        text-shadow: 0 0 2px yellow,
            0 0 3px yellow;

    }

    .x {
        color: white;
        width: auto;
        font-size: 3.5em;
        text-align: center;
        text-shadow: 0 0 3px yellow,
            0 0 5px yellow;
    }
</style>

<body>
    <img class="img-1" src="9a2ebc6b-3e95-4d52-9e60-7589a148db41.png">
    <img class="img-2" src="79b98b6c-b0bf-495c-97f0-29d72ca9b6b2.jpg">
    <img class="img-3" src="78597a71-c98d-42af-837b-53230561c4e8.png">
    <div class="card">
        <p class="q">服务器</p>
        <p class="a">泰拉</p>
        <span class="z">#</span>
        <span class="x">&nbsp;0</span>
    </div>
</body>

</html>
