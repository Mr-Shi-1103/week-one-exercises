<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 100px;
            height: 100px;
            border-radius: 100%;
        }

        .begin {
            width: 3em;
            height: 2em;
            background-color: rgb(217, 217, 217);
            border-radius: 5px;
            text-align: center;
            line-height: 2em;

        }

        .contain {
            width: 800px;
            height: 500px;
            border: solid 2px yellow;
            border-radius: 20px;
            position: relative;
        }

        .img-1 {
            position: absolute;
            top: 8%;
            left: 10%;
            translate: -50% 0;
        }

        .begin:hover~.contain .img-1 {
            animation-name: spin;
            animation-timing-function: ease;
            animation-duration: 2s;
            animation-fill-mode: both;
        }

        .img-2 {
            position: absolute;
            top: 10%;
            right: 50%;
            translate: 50% 0;
        }


        @keyframes spin {
            0% {
                top: 8%;
                left: 10%;

            }

            50% {
                top: 70%;
                left: 50%;
            }

            100% {
                top: 8%;
                left: 80%;
            }
        }

        ;
    </style>
</head>

<body>
    <div>
        <div class="begin">开启</div><br>
        <div class="contain">
            <img class="img-1" src="0500405b-418c-4961-85d1-d39ec6329ebb.png">
            <img class="img-2" src="f9f031d5-66e1-4a55-8619-6a959ebdaacc.png">
        </div>
    </div>
</body>

</html>
