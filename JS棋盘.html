  let size = 8;
  let item;
  let line = "";
  for (row = 1; row <= size; row++) {
    if (row % 2 == 1) {
      for (num = 1; num <= size; num++) {
        if (num % 2 == 1) {
          item = " ";
        }
        else {
          item = "#";
        }
        line += item;
      }
      console.log(line);
      line = "";
    }
    else {
      for (num = 1; num <= size; num++) {
        if (num % 2 == 0) {
          item = " ";
        }
        else {
          item = "#";
        }
        line += item;
      }
      console.log(line);
      line = "";
    }

  }
